name: Tests

concurrency:
  group: "tests-${{ github.ref }}"
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  linter:
    name: Lints
    runs-on: [hetzner-build]
    env:
      HOME: /root
      GOCACHE: /root/.cache/go-build
      GOPATH: /root/go
    steps:
      - name: Clone blobber
        uses: actions/checkout@v3

      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential nghttp2 libnghttp2-dev libssl-dev wget

      - name: Buf-lint
        if: success()
        run: make local

      - name: Build Base
        run: |
          ./docker.local/bin/build.base.sh

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=2m0s
          skip-cache: true
          skip-pkg-cache: true
          skip-build-cache: true

  unit-tests:
    name: Unit Tests
    runs-on: [hetzner-testsuite]
    env:
      HOME: /root
      GOCACHE: /root/.cache/go-build
      GOPATH: /root/go
    steps:
      - name: Clone blobber
        uses: actions/checkout@v3

      - name: Setup go
        uses: actions/setup-go@v3
        with:
          go-version: ^1.22

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential nghttp2 libnghttp2-dev libssl-dev wget

      - name: Run tests
        run: |
          cd $GITHUB_WORKSPACE/code/go/0chain.net/
          CGO_ENABLED=1 go test -tags bn256 -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v2
        with:
          files: ./code/go/0chain.net/coverage.txt
          flags: Unit-Tests
          verbose: true